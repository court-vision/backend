name: Backend Tests

# Note: GitHub disables scheduled workflows after 60 days without commits, which
# also silences the push trigger below (and with it the staging deploy chain).
# If runs stop appearing, re-enable it under Actions → Backend Tests → Enable.

on:
  pull_request:
    paths:
      - "**"
      - ".github/workflows/backend-tests.yml"
  push:
    branches: ["main"]
    paths:
      - "**"
      - ".github/workflows/backend-tests.yml"
  schedule:
    # 07:00 UTC daily (02:00 ET) — after post-game pipelines complete
    - cron: "0 7 * * *"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: cv_test
          POSTGRES_USER: cv
          POSTGRES_PASSWORD: cv
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U cv -d cv_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgresql://cv:cv@127.0.0.1:5432/cv_test
      PIPELINE_API_TOKEN: ci-test-token
      # Fake Clerk values — sufficient for unit/api tests (no real JWT validation)
      CLERK_JWKS_URL: https://fake.clerk.dev/.well-known/jwks.json
      CLERK_SECRET_KEY: sk_test_fake
      PYTHONPATH: ${{ github.workspace }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run unit and API tests
        run: |
          python -m pytest -m "unit or api" --cov=. --cov-report=term-missing --cov-report=xml

      - name: Run integration tests (main/nightly/manual only)
        if: github.event_name != 'pull_request'
        run: |
          set +e
          python -m pytest -m "integration"
          status=$?
          if [ $status -eq 5 ]; then
            echo "No integration tests collected yet."
            exit 0
          fi
          exit $status

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: coverage.xml

  # The production image. Railway builds this Dockerfile on merge and has no
  # health check that would hold back a container that does not answer, so it is
  # started here first: the same image and command, against this job's Postgres,
  # asked for /health over IPv4 (how Railway's public proxy reaches it) and IPv6
  # (the only protocol its private network carries, where data-platform calls
  # the jobs routes).
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: cv_test
          POSTGRES_USER: cv
          POSTGRES_PASSWORD: cv
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U cv -d cv_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      # No token left in .git/config: the build below copies the checkout into
      # the image (and .dockerignore keeps .git out of it as well).
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: The container starts and answers on IPv4 and IPv6
        run: |
          docker run -d --name api --network host \
            -e DATABASE_URL=postgresql://cv:cv@127.0.0.1:5432/cv_test \
            -e PIPELINE_API_TOKEN=ci-test-token \
            -e CLERK_JWKS_URL=https://fake.clerk.dev/.well-known/jwks.json \
            -e CLERK_SECRET_KEY=sk_test_fake \
            backend:ci
          for attempt in $(seq 1 30); do
            if curl -fsS -o /dev/null http://127.0.0.1:8080/health; then break; fi
            if [ -z "$(docker ps -q --filter name=api)" ]; then break; fi
            sleep 2
          done
          docker logs api
          echo "--- IPv4"; curl -fsS http://127.0.0.1:8080/health
          echo; echo "--- IPv6"; curl -fsS -g "http://[::1]:8080/health"
          echo; docker exec api sh -c 'echo "running as $(id -un)"'
